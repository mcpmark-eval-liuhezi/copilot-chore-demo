name: Build info

on:
  workflow_dispatch:

jobs:
  build-info:
    runs-on: ubuntu-latest
    steps:
      - name: Write build-info file
        run: |
          mkdir -p artifacts
          {
            echo "build-info"
            echo "generated_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "repository: ${GITHUB_REPOSITORY}"
            echo "run_id: ${GITHUB_RUN_ID}"
            echo "sha: ${GITHUB_SHA}"
          } > artifacts/build-info.txt
          cat artifacts/build-info.txt

      - name: Upload build-info artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: artifacts/build-info.txt
